[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maioutils"
version = "0.1.1"
description = "Reusable research, data-analysis, and general Python utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["DataFaker"]

[tool.setuptools.packages.find]
where = ["src"]
